name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run publish as a dry run
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-elements-react
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @citypay/elements-react
    runs-on: ubuntu-latest
    environment: npm
    # Manual rehearsals may use any branch; live publishing requires a release tag.
    if: github.event_name == 'release' || inputs.dry_run || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false

      - name: Verify package versions
        run: pnpm release:check

      - name: Verify stable tagged release
        if: github.event_name == 'release' || !inputs.dry_run
        run: pnpm release:check --stable
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Build library
        run: pnpm lib:build

      - name: Lint library
        run: pnpm --filter '@citypay/elements-react' lint

      - name: Check npm package contents
        working-directory: packages/lib
        run: pnpm pack --dry-run

      - name: Publish dry run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: packages/lib
        run: pnpm publish --access public --dry-run --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: github.event_name == 'release' || (startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run)
        working-directory: packages/lib
        run: pnpm publish --access public --tag latest --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
